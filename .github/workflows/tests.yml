# What a change has to survive once it is pushed.
#
# One job, because this repository is the theme alone: the smoke suite, the
# release toolchain and the agent notes are development-only files that stay on
# the machine that runs them, so nothing here may assume one is present. What is
# left is what a bare checkout can answer about the theme itself - every PHP file
# parses on every PHP a site may be running, and the two version numbers the
# theme is recognized by agree with each other.
#
# The suites and the archive build are not run here. They run on the development
# machine, and the archive is verified there against the commit it was built
# from before it is published.
name: Checks

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: Parse and version check on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      # One PHP failing must not hide the rest: a break on 7.4 and a break on
      # 8.3 are two different bugs, and the point of the matrix is to see both.
      fail-fast: false
      matrix:
        # The floor is what the theme declares (Requires PHP: 7.4), and the rest
        # is every version a site is likely to be on today.
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Every theme file is parsed, not just the ones a page loads: a template
      # behind a path no test reaches would otherwise break on the floor version
      # and be found by a site owner instead of here.
      - name: Parse every theme file on this PHP
        run: |
          status=0
          for file in $(git ls-files '*.php'); do
            php -l "$file" > /dev/null || status=1
          done
          exit "$status"

      # The theme is recognized by these two numbers and an update is announced
      # by them, so a release that moves one and not the other has to fail here
      # rather than on a site.
      - name: The two declared versions agree
        run: |
          style="$(sed -n 's/^Version:[[:space:]]*\([^[:space:]]*\).*$/\1/p' style.css | head -1)"
          define="$(sed -n "s/.*MAJESTIC_TUBE_VERSION',[[:space:]]*'\([^']*\)'.*/\1/p" functions.php | head -1)"

          echo "style.css  $style"
          echo "functions.php  $define"

          test -n "$style" && test "$style" = "$define"
